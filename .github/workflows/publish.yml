name: publish

# Puts a release on PyPI (pip install mathshuttle) when it is published on GitHub. PyPI trusts this
# workflow by its name and the "pypi" environment ("trusted publishing"): no token is stored anywhere.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag is the package's version
        run: python -c "import os, mathshuttle; tag = os.environ['GITHUB_REF_NAME']; assert tag == 'v' + mathshuttle.__version__, (tag, mathshuttle.__version__)"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mathshuttle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
