name: tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pandoc with MathShuttle's own download (the real one, checked against its SHA-256)
        shell: bash
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do python -m mathshuttle get-pandoc --force && break; sleep 5; done
          python -c "from mathshuttle import pandoc_fetch; print('MATHSHUTTLE_PANDOC=' + pandoc_fetch.installed_pandoc())" >> "$GITHUB_ENV"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Show versions
        run: python -m mathshuttle --version
      - name: Tests (Linux, on a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest tests -v -rs -o faulthandler_timeout=240
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: python -m pytest tests -v -rs -o faulthandler_timeout=240
      # The pasteboard tests are left out on the macOS runner: reading the pasteboard there now and then
      # blocks Tk's event loop for good (a paste-privacy prompt nobody answers, it seems). They run on a
      # real Mac before each release, as do the Word and PowerPoint checks.
      - name: Tests (macOS, without the pasteboard)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: >
          python -m pytest tests -v -rs -o faulthandler_timeout=240
          -k "not copy_for_office and not shuttle_clipboard" --ignore tests/test_clipboard_macos.py
