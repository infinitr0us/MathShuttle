name: tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pandoc 3.14
        shell: bash
        run: python tools/ci_pandoc.py >> "$GITHUB_PATH"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Show versions
        run: python -m mathshuttle --version
      - name: Tests (Linux, on a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest tests -q -rs
      - name: Tests
        if: runner.os != 'Linux'
        run: python -m pytest tests -q -rs
